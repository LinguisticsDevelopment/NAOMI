# Default configuration for the NSM Consciousness Transformer.
# Loaded by nsm_ct.config.load_config(). Unknown keys raise on load.

# Curriculum phase (reserved for staging harder regimes over time).
curriculum_phase: 1

# Sentence -> input-object encoder: "parser" (default) feeds the quantum_parser's
# structure (per-token role + tree depth) alongside the words; "token" is plain
# tokenization. Structure is additive + zero-init, so a flaky parse never hurts.
input_encoder: parser

model:
  consciousness_dim: 48      # width of the abstract state vector
  memory_dim: 48             # width of memory slots / reads
  d_model: 96                # transformer hidden size
  nhead: 4
  num_layers: 2
  dim_feedforward: 192
  dropout: 0.0               # 0.0 is fine at this toy scale; raise with real data
  max_sentence_len: 24       # max tokens per sentence / question / option
  reasoning_hops: 1          # multi-hop reasoning passes at the question (sequential mode)
  loop_mode: controlled      # controlled (self-driven read/think/respond) | sequential
  control_slack: 6           # extra ticks beyond #items for thinking/responding
  memory_addressing: content # content (overwrite, never forget) | slot (by index)
  use_long_term: false       # persistent cross-episode long-term memory (lifelong)
  ltm_max_size: 10000        # cap on long-term entries (pruning placeholder)
  ltm_overwrite: true        # update a near-duplicate in place vs. appending
  ltm_overwrite_threshold: 0.9

train:
  learning_rate: 0.001
  batch_size: 16
  epochs: 25
  seed: 0
  weight_answer: 1.0         # answer-correctness loss (the core task signal)
  weight_mem_answer: 0.25    # memory-bottleneck readout: answer must be recoverable
                             # from memory alone (makes trust-gated writes load-bearing)
  weight_multi: 0.0          # per-question loss for multi-question streams (probe trains with it)
  weight_consistency: 0.02   # placeholder consciousness consistency loss (kept small)
  grad_clip: 1.0

data:
  source: curriculum         # curriculum | babi | textbook
  answer_mode: mc            # mc | open
  num_episodes: 400
  val_fraction: 0.2
  seed: 0
  max_context: 6             # max statements per episode (padded)
  max_level: 6               # ceiling (4=distractors, 5=corroboration, 6=overwrite-update)
  babi_task: 1
  babi_path: null
